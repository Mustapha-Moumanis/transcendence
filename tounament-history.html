<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tournament</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <style>
        * {
            margin: 0;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;
        }
        .tounament-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 10px;
            height: fit-content;
            background-color: var(--base);
            padding: 10px;
            background-color: #070707;
        }
        .tounament-winner {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: 10px;
            width: 100%;
            gap: 10px;
        }
        
        .tounament-card .avatar {
            width: 60px;
            height: 60px;
        }

        .tounament-card .avatar img {
            max-width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;

            background-color: blanchedalmond;
        }

        .tounament-card .small-avatar {
            height: 30px;
            width: 30px;
            border-radius: 50px;
            box-shadow: 0 0 0 3px white;
        }

        .tounament-winner span {
            color: var(--title-color);
            font-weight: bold;
            text-align: center;
            
            color: white;
        }
        
        .tounament-users {
            display: flex;
            padding: 0 10px;
        }

        .tounament-users .small-avatar + .small-avatar {
            margin-left: -3px;
        }

        .tournament-detail {
            display: flex;
            align-items: center;
            justify-content: end;
            padding: 10px;
            width: 100%;
            cursor: pointer;
        }

        .tournament-detail span {
            text-transform: capitalize;
            padding: 5px 8px;
            fill: red;
        }

        .tournament-detail span:hover {

            fill: blue;
        }

        @media (max-width: 1200px) {
            .tounament-winner {
                flex-direction: column;
                justify-content: center;
                gap: 5px;
            }

            .tounament-winner span {
                font-size: small;
            }
        }




        .btn-main, .btn-sec {
    display: inline-block;
    font-family: var(--title-font);
    text-align: center;
    color: #070707;
    outline: 0;
    font-weight: bold;
    text-decoration: none;
    padding: 5px 20px 5px 20px;
    font-size: 14px;
    border: none;
    text-transform: uppercase;
    border-radius: 8px;
    -moz-border-radius: 8px;
    -webkit-border-radius: 8px;
    overflow: hidden;
    background-color: #C4F000;
    border: 1px solid #070707;
}
.btn-main,
.btn-sec,
.form-border * {
    -o-transition: 0.5s;
    -ms-transition: 0.5s;
    -moz-transition: 0.5s;
    -webkit-transition: 0.5s;
    transition: 0.5s;
    outline: none;
}

.btn-main:hover,
.btn-main:active,
.activeBtn {
    -webkit-box-shadow: 2px 2px 20px 0px rgba(196, 240, 0, 0.5);
    -moz-box-shadow: 2px 2px 20px 0px rgba(196, 240, 0, 0.5);
    box-shadow: 2px 2px 20px 0px rgba(196, 240, 0, 0.5);
    color: white;
    background-color: #070707;
    border: 1px solid rgba(196, 240, 0, 0.6);
}

.btn-main:disabled, .btn-sec:disabled {
    pointer-events: none;
    opacity: 0.65;
}
    </style>
