server {
    listen 80;

    root /var/www/html;
    index index.html;

    # Forward requests to the backend service running on port 8000
    location /api/ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: Serve static files or handle other routes
    location / {
        try_files $uri $uri/ =404;
    }


    location /ws/ {
        proxy_pass http://web:8000;  # Proxy to your Django Channels/Socket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uncomment the following lines to enable SSL (adjust paths and server_name as needed)
    # listen 443 ssl;
    # server_name your_domain_or_ip;

    # ssl_certificate     /path/to/your/cert.crt;
    # ssl_certificate_key /path/to/your/cert.key;
    # ssl_protocols TLSv1.3;
}