
    <!-- content begin -->
    <div class="no-bottom no-top" id="content">
        <section class="v-center">
            <div class="container">
                    <div class="row align-items-center">
                        <div class="col-lg-6 offset-lg-3 z-1000">
                            <div class="main-content  ">
                                <div class="text-center">
                                    <h4 class="main-font">Reset your password</h4>
                                    <p>Please enter your email address. You will receive a code to create a new password via email.</p>
                                </div>
                                
                                <form id='form_reset_password' class="form-border">
                                    <div class="row">
                                        
                                        <div class="col-md-12">
                                            <div class="field-set">
                                                <label for="email">Email Address:</label>
                                                <input type='text' name='email' id='email' class="form-control" autocomplete="on">
                                            </div>
                                        </div>

                                        <div class="spacer-20"></div>

                                        <div class="col-lg-6 offset-lg-3 text-center">
                                            <div id='submit'>
                                                <input type='submit' id='send_message' value='Send Now' class="btn-main">
                                            </div>
                                        </div>


                                        <div class="col-md-12">

                                            <div id='mail_success' class='success'>Your message has been sent successfully.</div>
                                            <div id='mail_fail' class='error'>Sorry, error occured this time sending your message.</div>
                                            <div class="clearfix"></div>

                                        </div>
                                        <div class="spacer-20"></div>
                                        <!-- <h6 class="text-center">Don't have an account yet? <a href="#register">Sign Up</a></h6> -->
                                        <h6 class="text-center">Remembered your password? <span class="router" data-router="login">Sign In</span></h6>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
        </section>
    </div>
    <!-- content close -->
