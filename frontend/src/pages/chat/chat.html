<div id="chat-content" class="chat-container">
    <div class="chat-sidebar">
        <div class="chat-nav-sidebar">
            <div class="chat-active chat-btn chat-msg-btn">Messages</div>
            <div class="chat-btn chat-friend-btn">Friends</div>
            <div class="nav-indicator"><span></span></div>
        </div>
        <div class="chat-list d-none">
            <!-- Users list -->
        </div>
        <div class="friend-chat d-none">
            <!-- Friend list -->
        </div>
        <div class="loading-chat-list">
            <div class="chat-user-card">
                <div class="chat-user-img">
                    <div class="cercle bg-loading"></div>
                </div>
                <div class="chat-user-content">
                    <div class="rectangle bg-loading w-75"></div><br>
                    <div class="rectangle bg-loading w-25" ></div>
                </div>
            </div>
            <div class="chat-user-card">
                <div class="chat-user-img">
                    <div class="cercle bg-loading"></div>
                </div>
                <div class="chat-user-content">
                    <div class="rectangle bg-loading w-75"></div><br>
                    <div class="rectangle bg-loading w-25" ></div>
                </div>
            </div>
            <div class="chat-user-card">
                <div class="chat-user-img">
                    <div class="cercle bg-loading"></div>
                </div>
                <div class="chat-user-content">
                    <div class="rectangle bg-loading w-75"></div><br>
                    <div class="rectangle bg-loading w-25" ></div>
                </div>
            </div>
            <div class="chat-user-card">
                <div class="chat-user-img">
                    <div class="cercle bg-loading"></div>
                </div>
                <div class="chat-user-content">
                    <div class="rectangle bg-loading w-75"></div><br>
                    <div class="rectangle bg-loading w-25" ></div>
                </div>
            </div>
        </div>
    </div>
    <div class="welcome-chat">
        <img src="chat/icons/welcome-chat.png" alt="welcome-chat">
        <h3>Let's Chat!</h3>
        <p>Start With Friends Or Meet New People<p>
    </div>
    <div class="d-none main-chat">
        <div class="chat-header">
            <!-- Header chat -->
        </div>
        <div class="chat-box" id="id_chat_item_container">
            <!-- Conversations -->
        </div>
        <div class="d-none list-emoji"></div>
        <div class="input-box">
            <img id="id_message_send-emojis" src="chat/icons/emoji-icon.svg" alt="emoji-icon">
            <input autocomplete="off" id="id_message_send_input" type="text" placeholder="Enter your message">
            <img id="id_message_send_button" src="chat/icons/Send_fill.svg" alt="Send">
        </div>
    </div>
    <div class="d-none loading-chat">
        <div class="chat-header">
            <div class="chat-user-img">
                <div class="cercle bg-loading"></div>
            </div>
            <div class="chat-user-content">
                <div class="rectangle bg-loading w-50"></div><br>
                <div class="rectangle bg-loading w-25" ></div>
            </div>
        </div>
        <div class="chat-box">
            <div class="message received bg-loading rectangle w-25 h-25"></div>
            <div class="message sent bg-loading rectangle w-50 h-25"></div>
            <div class="message received bg-loading rectangle w-25 h-25"></div>
            <div class="message sent bg-loading rectangle w-25 h-25"></div>
            <div class="message received bg-loading rectangle w-50 h-25"></div>
            <div class="message sent bg-loading rectangle w-25 h-25"></div>
            <div class="message received bg-loading rectangle w-25 h-25"></div>
            <div class="message sent bg-loading rectangle w-50 h-25"></div>
        </div>
        <div class="input-box">
            <div class="rectangle bg-loading w-100 h-100" ></div>
        </div>
    </div>
</div>
