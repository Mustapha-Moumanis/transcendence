
    <!-- content begin -->
    <div class="no-bottom no-top" id="content">
        <section class="v-center">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-lg-6 offset-lg-3 z-1000">
                        <div class="main-content  ">
                            <div class="text-center">
                                <h4 class="main-font">Reset your password</h4>
                                <p>we sent a code to <span class="email">user@gmail.com</span></p>
                            </div>
                            
                            <form id='form_reset_password_confirm' class="form-border">
                                <div class="numbers-field">
                                    <input type="number" name="number_1" class="form-control" placeholder="0"/>
                                    <input type="number" name="number_2" disabled class="form-control" placeholder="0"/>
                                    <input type="number" name="number_3" disabled class="form-control" placeholder="0"/>
                                    <input type="number" name="number_4" disabled class="form-control" placeholder="0"/>
                                    <input type="number" name="number_5" disabled class="form-control" placeholder="0"/>
                                    <input type="number" name="number_6" disabled class="form-control" placeholder="0"/>
                                </div>

                                <div class="spacer-20"></div>

                                <h6 class="text-center">Didn't receive code? <a href="#" id="request-again">Request again </a><span id="counter"></span> </h6>
                                
                                <div class="spacer-20"></div>

                                <div class="field-set d-none">
                                    <label for="email">Email Address:</label>
                                    <input type='text' name='email' id='email' class="form-control" autocomplete="on">
                                </div>

                                <div class="field-set">
                                    <label for="password">Password:</label>
                                    <input type='password' name='password' id='password' class="form-control" autocomplete="off">
                                </div>

                                <div class="field-set">
                                    <label for="re-password">Re-enter Password:</label>
                                    <input type='password' name='re-password' id='re-password' class="form-control" autocomplete="off">
                                </div>

                                <div class="spacer-20"></div>

                                <div class="col-lg-6 offset-lg-3 text-center">
                                    <div id='submit'>
                                        <input type='submit' id='send_message' value='Send Now' class="btn-main">
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <!-- content close -->
